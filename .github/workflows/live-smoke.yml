name: Verify production MCP custom domain
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed health endpoint
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 --max-time 20 \
            https://mcp.shauryaswebsites.com/health | tee /tmp/health.json
          python3 -c "import json; assert json.load(open('/tmp/health.json'))['ok'] is True"
      - name: Verify MCP handshake
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 20 \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"live-smoke","version":"1.0.0"}}}' \
            https://mcp.shauryaswebsites.com/mcp | tee /tmp/initialize.json
          python3 -c "import json; assert 'protocolVersion' in json.load(open('/tmp/initialize.json'))['result']"
      - name: Verify tool discovery
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 20 \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            https://mcp.shauryaswebsites.com/mcp | tee /tmp/tools.json
          python3 -c "import json; d=json.load(open('/tmp/tools.json')); assert [x['name'] for x in d['result']['tools']] == ['triage_all_new_feedback','list_feedback']"
      - name: Verify live Feedback access without printing submissions
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 30 \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"triage_all_new_feedback","arguments":{}}}' \
            https://mcp.shauryaswebsites.com/mcp > /tmp/triage.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/triage.json'))
          assert 'result' in r, 'Missing MCP result'
          assert r['result'].get('isError') is False, 'MCP Feedback query reported an error'
          p=json.loads(r['result']['content'][0]['text'])
          assert p['queue']=='New Feedback'
          assert isinstance(p['items'], list)
          assert all('email' not in item for item in p['items'])
          print('Live Feedback read succeeded. Entries:',p['count'],'Total:',p['total'],'Truncated:',p['truncated'])
          PY
      - name: Verify status-filtered production feedback without logging private content
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 30 \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"list_feedback","arguments":{"status":"Done"}}}' \
            https://mcp.shauryaswebsites.com/mcp > /tmp/production-feedback.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/production-feedback.json'))
          assert r['result'].get('isError') is False, 'Status-filtered Feedback query failed'
          p=json.loads(r['result']['content'][0]['text'])
          assert p['status_filter']=='Done'
          assert isinstance(p['items'],list)
          assert all('email' not in row and row['status']=='Done' for row in p['items'])
          print('Production feedback query passed. Count:',p['count'],'Total:',p['total'],'Truncated:',p['truncated'])
          print('PRODUCTION_ITEMS_JSON='+json.dumps(p['items'],ensure_ascii=False))
          PY
      - name: Verify and report Will Not Do feedback (public fields only)
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 30 \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"list_feedback","arguments":{"status":"Not Planned"}}}' \
            https://mcp.shauryaswebsites.com/mcp > /tmp/not-planned-feedback.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/not-planned-feedback.json'))
          assert r['result'].get('isError') is False
          p=json.loads(r['result']['content'][0]['text'])
          assert p['status_filter']=='Not Planned' and not p['truncated']
          assert all('email' not in row and row['status']=='Not Planned' for row in p['items'])
          print('NOT_PLANNED_ITEMS_JSON='+json.dumps(p['items'],ensure_ascii=False))
          PY
