name: Test and deploy Shaurya's Websites MCP
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        if: hashFiles('package-lock.json') != ''
      - run: npm install --ignore-scripts
        if: hashFiles('package-lock.json') == ''
      - run: npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure Cloudflare credentials exist
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets."
            exit 1
          fi
      - run: npm install --ignore-scripts
      - run: npx wrangler deploy
      - name: Verify MCP endpoint is online
        run: |
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors https://mcp.shauryaswebsites.com/health | grep '"ok":true'
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' https://mcp.shauryaswebsites.com/mcp | grep 'triage_all_new_feedback'
