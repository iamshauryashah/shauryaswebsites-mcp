name: Test Shaurya's Websites MCP
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        if: hashFiles('package-lock.json') != ''
      - run: npm install --ignore-scripts
        if: hashFiles('package-lock.json') == ''
      - run: npm test
